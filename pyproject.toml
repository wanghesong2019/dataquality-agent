[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataquality-agent"
version = "0.2.1"
description = "数据质量巡检 + 异常归因 + 整改闭环 DataAgent"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9",
    "pandas>=2.0",
    "scipy>=1.10",
    "pydantic>=2.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
dqagent = "dataquality_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
